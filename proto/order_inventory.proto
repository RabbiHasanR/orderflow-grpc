syntax = "proto3";

// Shared contract between order-service (gRPC client) and inventory-service
// (gRPC server). Owned by neither service; generated into both. Edit this file,
// then regenerate stubs with `bash scripts/regen_proto.sh` — never hand-edit the
// generated output.
package orderflow.inventory.v1;

// Four RPC shapes over the same inventory:
//   - ReserveStock: unary, one order, all-or-nothing (workflow.md).
//   - ReserveStockBulk: client-streaming, MANY orders, best-effort per item.
//   - WatchLowStock: server-streaming, read-only low-stock query.
//   - WatchStock: bidirectional-streaming, read-only live stock subscription.
service InventoryService {
  // Atomically reserve stock for an order, all-or-nothing. Maps 1:1 onto the
  // inventory service layer's reserve_stock(order_ref, items) function.
  rpc ReserveStock(ReserveStockRequest) returns (ReserveStockResponse);

  // Client-streaming: reserve lines across MANY orders, best-effort per item.
  // The client streams one BulkReserveItem per line; the server reserves each
  // in its own transaction (some may succeed while others fail) and returns a
  // single aggregate summary once the stream is exhausted. Contrast with the
  // unary all-or-nothing ReserveStock above.
  rpc ReserveStockBulk(stream BulkReserveItem) returns (BulkReserveSummary);

  // Server-streaming: one query in, a stream of matching products out. The
  // server yields every product at/below the requested threshold one message at
  // a time, straight from a DB cursor — no big list is buffered on either side.
  // An empty result is a valid zero-message stream, not an error.
  rpc WatchLowStock(LowStockQuery) returns (stream ProductStock);

  // Bidirectional-streaming: client streams subscribe/unsubscribe commands, the
  // server independently streams stock updates for the CURRENT watch set — a
  // SNAPSHOT when a product is subscribed, then a fresh value each time a watched
  // product changes (detected on a poll tick). The two streams are decoupled:
  // responses are NOT 1:1 with requests, and both flow concurrently over one
  // long-lived call. Read-only; the reservation write-path is untouched.
  rpc WatchStock(stream WatchCommand) returns (stream StockUpdate);
}

// One requested line: reserve `quantity` of product `product_id`.
message ReserveItem {
  // Inventory product id. int64 to match Django's BigAutoField primary key.
  int64 product_id = 1;
  // Requested amount. int32 (not uint32) so a non-positive value can still be
  // sent and rejected by the server's per-item validation.
  int32 quantity = 2;
}

message ReserveStockRequest {
  // The order-service order id this reservation is for — the cross-service
  // reference stored on each StockReservation (no FK across services).
  string order_ref = 1;
  repeated ReserveItem items = 2;
}

// Per-item result. `reason` is empty when `reserved` is true.
message ItemOutcome {
  int64 product_id = 1;
  bool reserved = 2;
  string reason = 3;
}

message ReserveStockResponse {
  // True only if every item was reserved; when false, nothing was persisted.
  bool success = 1;
  repeated ItemOutcome results = 2;
}

// One streamed line for ReserveStockBulk. Self-contained: unlike the unary
// request (which names its order_ref once), each streamed line carries its own
// order_ref so a single stream can span many orders.
message BulkReserveItem {
  string order_ref = 1;
  int64 product_id = 2;
  int32 quantity = 3;
}

// Per-line result for the bulk stream. Like ItemOutcome but also echoes the
// order_ref, so the caller can regroup outcomes by order.
message BulkItemOutcome {
  string order_ref = 1;
  int64 product_id = 2;
  bool reserved = 3;
  string reason = 4;
}

// The single "one-out" response returned after the whole stream is read.
message BulkReserveSummary {
  int32 total = 1;
  int32 reserved_count = 2;
  int32 failed_count = 3;
  repeated BulkItemOutcome results = 4;
}

// Query for WatchLowStock: stream products whose available_quantity is at or
// below `threshold`, optionally restricted to SKUs starting with `sku_prefix`.
message LowStockQuery {
  // Inclusive upper bound on available_quantity. int32 (not uint32) so a
  // negative value can be sent and rejected by the server.
  int32 threshold = 1;
  // Optional SKU prefix filter; "" means no filter.
  string sku_prefix = 2;
}

// One streamed product in the WatchLowStock response.
message ProductStock {
  int64 product_id = 1;
  string sku = 2;
  string name = 3;
  int32 available_quantity = 4;
}

// One command on the WatchStock request stream: add or remove product ids from
// the server-side watch set. The client sends these whenever it wants — they are
// not answered one-for-one; they reshape what the response stream emits.
message WatchCommand {
  enum Action {
    SUBSCRIBE = 0;    // add product_ids to the watch set (emit a snapshot each)
    UNSUBSCRIBE = 1;  // remove product_ids from the watch set
  }
  Action action = 1;
  repeated int64 product_ids = 2;
}

// One streamed message on the WatchStock response stream.
message StockUpdate {
  // Why this update was emitted: an initial value on subscribe, or a later
  // change picked up on a poll tick.
  enum Kind {
    SNAPSHOT = 0;  // first value sent right after a product is subscribed
    CHANGED = 1;   // available_quantity differs from the last value we sent
  }
  int64 product_id = 1;
  string sku = 2;
  string name = 3;
  int32 available_quantity = 4;
  Kind kind = 5;
}
