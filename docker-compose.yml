# OrderFlow gRPC — Compose stack.
#
# SCOPE: order-service (public REST edge, gRPC client) + its order-db, plus
# inventory-service (gRPC server) + inventory-db. Multi-replica ready: the client
# channel is round_robin over `dns:///`, so scale inventory at runtime with
#   docker compose up --build --scale inventory-service=3
#
# Migrations run ONCE in the dedicated `*-migrate` one-shot services (D-026): the
# app containers no longer migrate on boot, so N replicas can't race `migrate` /
# `alembic upgrade` on the shared DB. Each migrate service reuses its app's built
# image (shared `image:` tag) and just overrides `command`; the app waits for it
# via `depends_on: { condition: service_completed_successfully }`.
#
# Per the architecture: gRPC backends are INTERNAL ONLY — only order-service:8000
# is published to the host. All secrets/config come from .env (see .env.example);
# nothing is hardcoded.


services:
  # --- inventory side (gRPC server) -------------------------------------------
  inventory-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${INVENTORY_POSTGRES_DB:-inventory}
      POSTGRES_USER: ${INVENTORY_POSTGRES_USER:-inventory}
      POSTGRES_PASSWORD: ${INVENTORY_POSTGRES_PASSWORD:?INVENTORY_POSTGRES_PASSWORD is required}
    volumes:
      - inventory-db-data:/var/lib/postgresql/data
    healthcheck:
      # Gate dependents until Postgres actually accepts connections.
      test: ["CMD-SHELL", "pg_isready -U ${INVENTORY_POSTGRES_USER:-inventory} -d ${INVENTORY_POSTGRES_DB:-inventory}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # One-shot migration job — runs `manage.py migrate` once and exits. The app
  # replicas wait on this via `service_completed_successfully`, so no replica ever
  # races migrations on the shared inventory-db (D-026). Reuses the app image.
  inventory-migrate:
    build:
      context: ./inventory-service
    image: orderflow-inventory:latest
    command: ["python", "manage.py", "migrate", "--noinput"]
    env_file:
      - .env
    environment:
      # Same DB wiring the app uses (POSTGRES_HOST must match the db service name).
      POSTGRES_HOST: inventory-db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${INVENTORY_POSTGRES_DB:-inventory}
      POSTGRES_USER: ${INVENTORY_POSTGRES_USER:-inventory}
      POSTGRES_PASSWORD: ${INVENTORY_POSTGRES_PASSWORD:?INVENTORY_POSTGRES_PASSWORD is required}
    depends_on:
      inventory-db:
        condition: service_healthy
    restart: "no"

  inventory-service:
    # Reuses the image built by inventory-migrate (same build context + tag), so
    # the image is built once. Safe to scale: `--scale inventory-service=N`.
    image: orderflow-inventory:latest
    env_file:
      - .env
    environment:
      # DB connection — POSTGRES_HOST must match the service name above.
      # Map the INVENTORY_-prefixed host vars down to the bare POSTGRES_* names
      # the app reads inside the container (compose `environment` wins over env_file).
      POSTGRES_HOST: inventory-db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${INVENTORY_POSTGRES_DB:-inventory}
      POSTGRES_USER: ${INVENTORY_POSTGRES_USER:-inventory}
      POSTGRES_PASSWORD: ${INVENTORY_POSTGRES_PASSWORD:?INVENTORY_POSTGRES_PASSWORD is required}
    depends_on:
      inventory-db:
        condition: service_healthy
      inventory-migrate:
        condition: service_completed_successfully
    # No `ports:` — the gRPC server stays internal to the compose network.
    # Reachable as `inventory-service:50051` from other services on the network.
    restart: unless-stopped

  # --- order side (FastAPI REST edge, gRPC client) ----------------------------
  order-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${ORDER_POSTGRES_DB:-orders}
      POSTGRES_USER: ${ORDER_POSTGRES_USER:-orders}
      POSTGRES_PASSWORD: ${ORDER_POSTGRES_PASSWORD:?ORDER_POSTGRES_PASSWORD is required}
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORDER_POSTGRES_USER:-orders} -d ${ORDER_POSTGRES_DB:-orders}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # One-shot Alembic migration job — runs `alembic upgrade head` once and exits,
  # so order-service replicas never race the schema upgrade on the shared order-db.
  order-migrate:
    build:
      context: ./order-service
    image: orderflow-order:latest
    command: ["alembic", "upgrade", "head"]
    env_file:
      - .env
    environment:
      POSTGRES_HOST: order-db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${ORDER_POSTGRES_DB:-orders}
      POSTGRES_USER: ${ORDER_POSTGRES_USER:-orders}
      POSTGRES_PASSWORD: ${ORDER_POSTGRES_PASSWORD:?ORDER_POSTGRES_PASSWORD is required}
    depends_on:
      order-db:
        condition: service_healthy
    restart: "no"

  order-service:
    # Reuses the image built by order-migrate (same build context + tag).
    image: orderflow-order:latest
    # env_file supplies the shared GRPC_AUTH_TOKEN; the explicit `environment`
    # below overrides POSTGRES_* so order-service talks to its OWN order-db (not
    # inventory's) — compose `environment` wins over `env_file`.
    env_file:
      - .env
    environment:
      POSTGRES_HOST: order-db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${ORDER_POSTGRES_DB:-orders}
      POSTGRES_USER: ${ORDER_POSTGRES_USER:-orders}
      POSTGRES_PASSWORD: ${ORDER_POSTGRES_PASSWORD:?ORDER_POSTGRES_PASSWORD is required}
      # Client-side load balancing target — `dns:///` resolves every inventory
      # replica's IP and round-robins across them (scale with --scale).
      INVENTORY_GRPC_TARGETS: inventory-service:50051
    # No `ports:` — order-service is now INTERNAL. nginx (below) is the single
    # published edge and L7 load-balances across order-service replicas, so this
    # can scale: `--scale order-service=N` (a host port here would collide).
    depends_on:
      order-db:
        condition: service_healthy
      order-migrate:
        condition: service_completed_successfully
      inventory-service:
        # Wait until inventory reports SERVING via its gRPC health probe, not just
        # "started" — so order-service never opens the channel before a backend is ready.
        condition: service_healthy
    restart: unless-stopped

  # --- public edge (L7 reverse proxy / load balancer) -------------------------
  # The ONLY host-published port in the whole stack. nginx round-robins across all
  # order-service replicas (resolved at runtime via Docker DNS, D-043), so the
  # REST edge scales behind one stable URL: http://localhost:8000.
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8000:80"
    depends_on:
      order-service:
        condition: service_healthy
    healthcheck:
      # nginx's own liveness (independent of the backend) via the local endpoint.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/nginx-health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  inventory-db-data:
  order-db-data:
