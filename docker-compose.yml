# OrderFlow gRPC — Compose stack.
#
# SCOPE (this phase): order-service (public REST edge, gRPC client) + its order-db,
# plus the existing inventory-service (gRPC server) + inventory-db. Still a SINGLE
# inventory replica (D-026); the 2nd replica + one-shot migrate job for the
# round-robin demo come later. The client channel is already round_robin-ready, so
# that is a runtime change (e.g. `--scale`), not a code change.
#
# Per the architecture: gRPC backends are INTERNAL ONLY — only order-service:8000
# is published to the host. All secrets/config come from .env (see .env.example);
# nothing is hardcoded.

services:
  # --- inventory side (gRPC server) -------------------------------------------
  inventory-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${INVENTORY_POSTGRES_DB:-inventory}
      POSTGRES_USER: ${INVENTORY_POSTGRES_USER:-inventory}
      POSTGRES_PASSWORD: ${INVENTORY_POSTGRES_PASSWORD:?INVENTORY_POSTGRES_PASSWORD is required}
    volumes:
      - inventory-db-data:/var/lib/postgresql/data
    healthcheck:
      # Gate dependents until Postgres actually accepts connections.
      test: ["CMD-SHELL", "pg_isready -U ${INVENTORY_POSTGRES_USER:-inventory} -d ${INVENTORY_POSTGRES_DB:-inventory}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  inventory-service:
    build:
      context: ./inventory-service
    # Single replica for now (D-026): migrations run in the entrypoint, so a 2nd
    # replica would race `migrate`. Round-robin LB is a later phase.
    env_file:
      - .env
    environment:
      # DB connection — POSTGRES_HOST must match the service name above.
      # Map the INVENTORY_-prefixed host vars down to the bare POSTGRES_* names
      # the app reads inside the container (compose `environment` wins over env_file).
      POSTGRES_HOST: inventory-db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${INVENTORY_POSTGRES_DB:-inventory}
      POSTGRES_USER: ${INVENTORY_POSTGRES_USER:-inventory}
      POSTGRES_PASSWORD: ${INVENTORY_POSTGRES_PASSWORD:?INVENTORY_POSTGRES_PASSWORD is required}
    depends_on:
      inventory-db:
        condition: service_healthy
    # No `ports:` — the gRPC server stays internal to the compose network.
    # Reachable as `inventory-service:50051` from other services on the network.
    restart: unless-stopped

  # --- order side (FastAPI REST edge, gRPC client) ----------------------------
  order-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${ORDER_POSTGRES_DB:-orders}
      POSTGRES_USER: ${ORDER_POSTGRES_USER:-orders}
      POSTGRES_PASSWORD: ${ORDER_POSTGRES_PASSWORD:?ORDER_POSTGRES_PASSWORD is required}
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORDER_POSTGRES_USER:-orders} -d ${ORDER_POSTGRES_DB:-orders}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  order-service:
    build:
      context: ./order-service
    # env_file supplies the shared GRPC_AUTH_TOKEN; the explicit `environment`
    # below overrides POSTGRES_* so order-service talks to its OWN order-db (not
    # inventory's) — compose `environment` wins over `env_file`.
    env_file:
      - .env
    environment:
      POSTGRES_HOST: order-db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${ORDER_POSTGRES_DB:-orders}
      POSTGRES_USER: ${ORDER_POSTGRES_USER:-orders}
      POSTGRES_PASSWORD: ${ORDER_POSTGRES_PASSWORD:?ORDER_POSTGRES_PASSWORD is required}
      # Client-side load balancing target(s). One replica today (D-026).
      INVENTORY_GRPC_TARGETS: inventory-service:50051
    ports:
      # The ONLY host-published port in the whole stack (architecture §4).
      - "8000:8000"
    depends_on:
      order-db:
        condition: service_healthy
      inventory-service:
        condition: service_started
    restart: unless-stopped

volumes:
  inventory-db-data:
  order-db-data:
