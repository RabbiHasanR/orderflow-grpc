# nginx — the single public HTTP edge in front of a scaled order-service.
#
# order-service no longer publishes a host port; nginx (published on :8000) L7
# load-balances across every order-service replica. This mirrors, at the REST
# edge, the client-side round-robin the gRPC client already does toward inventory.
#
# Open-source nginx gotcha: a static `upstream { server order-service:8000; }`
# resolves the name ONCE at startup and pins to a single replica. To pick up
# `--scale`d replicas we resolve at runtime via Docker's embedded DNS and put the
# host in a variable — nginx re-resolves per the resolver's `valid` TTL. Cost:
# balancing is at DNS-refresh granularity (every 5s), not strictly per-request —
# fine for a demo; a dedicated LB/mesh gives per-request balancing (see D-043).

events {}

http {
    # Docker's embedded DNS. `valid` bounds how long a resolution is cached, so a
    # newly scaled replica is seen within ~5s. ipv6=off keeps it to the v4 records.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # WebSocket upgrade plumbing for WS /inventory/stock-watch: echo the client's
    # Upgrade header, and set Connection: upgrade only when one is present.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;

        # nginx's own liveness — deliberately independent of order-service so the
        # container healthcheck reflects nginx, not the backend.
        location = /nginx-health {
            return 200 "ok\n";
        }

        location / {
            # Variable host → runtime DNS resolution (see header note). $request_uri
            # is REQUIRED here: with a variable in proxy_pass, nginx does not append
            # the request path automatically.
            set $order_upstream order-service:8000;
            proxy_pass http://$order_upstream$request_uri;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support (bidi WatchStock bridge).
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Streaming endpoints (NDJSON /inventory/low-stock, the live WS): don't
            # buffer, and allow long-lived reads so a watch isn't cut off.
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
