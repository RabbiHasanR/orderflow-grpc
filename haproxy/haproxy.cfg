# HAProxy — the single public HTTP edge in front of a scaled order-service.
#
# This REPLACES the nginx edge (D-043) to mock a real deployment: instead of
# nginx's DNS-cache pinning (it re-resolves order-service only every ~5s, so a
# burst can land entirely on one replica), HAProxy keeps a LIVE pool of backend
# servers and does TRUE per-request load balancing with active health checks.
#
# How it discovers `--scale`d replicas (the interesting bit):
#   - `resolvers docker` points at Docker's embedded DNS (127.0.0.11).
#   - `server-template order 4 ...` pre-provisions 4 backend SLOTS, each filled
#     from the `order-service` DNS record set and RE-RESOLVED continuously.
#     Scale up/down (`--scale order-service=N`, N<=4) and HAProxy adds/drains
#     slots within a DNS TTL — no config change, no restart.
#   - `check` runs an active HTTP health probe per slot, so a dead/booting
#     replica is ejected in ms and never receives a request (nginx here had no
#     app-level health check at all).
# Balancing granularity is PER REQUEST (roundrobin), not per-DNS-refresh.

global
    log stdout format raw local0
    # Keep the runtime API available for `show servers state` debugging.
    # Must live in /var/lib/haproxy: the image runs as the unprivileged `haproxy`
    # user, which owns that dir but cannot create files in root-owned /var/run.
    stats socket /var/lib/haproxy/haproxy.sock mode 660 level admin

defaults
    mode http
    log global
    option httplog
    option dontlognull
    # Long timeouts so streaming endpoints (NDJSON /inventory/low-stock and the
    # bidi WS /inventory/stock-watch) are not cut off. `tunnel` governs a
    # connection AFTER a WebSocket upgrade; keep it long-lived.
    timeout connect 5s
    timeout client  1h
    timeout server  1h
    timeout tunnel  1h
    # Retry idempotent connection failures onto another live backend.
    retries 3

# Docker's embedded DNS. `hold valid 5s` bounds how long a good answer is cached,
# so a newly scaled replica is picked up within ~5s — but unlike nginx this only
# governs DISCOVERY; request-level balancing across the known-live pool is instant.
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid      5s
    hold nx         1s
    hold timeout    1s

# nginx's own liveness endpoint had /nginx-health; HAProxy exposes an equivalent
# so the container healthcheck reflects the edge itself, independent of backends.
frontend http_in
    bind *:80

    # Edge liveness — answered by HAProxy directly, never proxied.
    acl is_edge_health path /haproxy-health
    http-request return status 200 content-type text/plain string "ok\n" if is_edge_health

    default_backend orders

backend orders
    balance roundrobin
    # Active health check hits order-service's own health endpoint. `inter 5s`
    # keeps the pool fresh; a failed check drains that slot from rotation.
    option httpchk GET /healthz
    http-check expect status 200
    # 4 slots, all resolved from the single `order-service` service name via
    # Docker DNS. Raise the count if you scale beyond 4 replicas.
    server-template order 4 order-service:8000 check resolvers docker inter 5s
